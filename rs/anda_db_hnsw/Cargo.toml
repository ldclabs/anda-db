[package]
name = "anda_db_hnsw"
description = "A high-performance vector search library in Rust."
repository = "https://github.com/ldclabs/anda-db/tree/main/rs/anda_db_hnsw"
version = "0.11.0"
publish = true
edition.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[dependencies]
cbor2 = { workspace = true }
croaring = { workspace = true }
futures = { workspace = true, features = ["alloc"] }
rand = { workspace = true, features = ["thread_rng"] }
ordered-float = { workspace = true }
half = { workspace = true }
serde = { workspace = true }
smallvec = { workspace = true, features = ["serde", "const_new"] }
parking_lot = { workspace = true }
papaya = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
log = { workspace = true }
rustc-hash = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
structured-logger = { workspace = true }

[[bench]]
name = "hnsw_index"
harness = false

[[example]]
name = "hnsw_demo"

[lib]
doctest = false

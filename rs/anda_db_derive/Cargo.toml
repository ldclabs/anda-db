[package]
name = "anda_db_derive"
description = "A Rust procedural macro crate that provides derive macros for AndaDB schema types."
repository = "https://github.com/ldclabs/anda-db/tree/main/rs/anda_db_derive"
version = "0.14.0"
publish = true
edition.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[lib]
proc-macro = true
doctest = true

[dependencies]
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }
proc-macro-crate = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
# Cyclic dev-dependency (allowed by cargo, stripped on publish): used by the
# trybuild UI tests to compile the generated code for real.
anda_db_schema = { path = "../anda_db_schema" }
trybuild = { workspace = true }

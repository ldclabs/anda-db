[package]
name = "anda_cognitive_nexus"
version = "0.14.0"
description = "A Rust implementation of KIP (Knowledge Interaction Protocol) base on Anda DB."
keywords = [
  "KIP",
  "context-engineering",
  "knowledge-graph",
  "persistent-memory",
  "ai-agent",
]
categories = ["database", "data-structures", "text-processing"]
repository = "https://github.com/ldclabs/anda-db/tree/main/rs/anda_cognitive_nexus"
publish = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Trusted, session-local lifecycle eligibility time for isolated simulations.
# It never changes authentication, authorization, lease or transaction clocks.
simulation = []

[dependencies]
anda_db_schema = { version = "0.14", path = "../anda_db_schema" }
anda_kip = { version = "0.14", path = "../anda_kip", features = ["schema-validation"] }
anda_db = { version = "0.14", path = "../anda_db", features = ["full"] }
anda_db_tfs = { version = "0.14", path = "../anda_db_tfs", features = ["full"] }
async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
jsonschema = { workspace = true }
# The 1.x migration rewrites a production database at startup; that has to be
# visible in the operator's log rather than inferred from a changed row count.
log = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
rustc-hash = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
# §9.6: a string Literal is canonicalized to NFC on write, so NFC/NFD twins
# resolve to one Proposition.
unicode-normalization = { workspace = true }

[dev-dependencies]
anda_object_store = { path = "../anda_object_store", version = "0.14" }
tokio = { workspace = true, features = ["full"] }
object_store = { workspace = true, features = ["fs"] }
structured-logger = { workspace = true }
log = { workspace = true }

[lib]
doctest = false

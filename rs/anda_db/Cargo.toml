[package]
name = "anda_db"
version = "0.11.0"
description = "Anda DB is a Rust library designed as a specialized database for AI Agents, focusing on knowledge & memory."
keywords = ["database", "vector", "search", "embedding", "ai"]
categories = ["database", "data-structures", "text-processing"]
repository = "https://github.com/ldclabs/anda-db/tree/main/rs/anda_db"
publish = true
edition.workspace = true
license.workspace = true

[dependencies]
anda_db_utils = { version = "0.11", path = "../anda_db_utils" }
anda_db_schema = { path = "../anda_db_schema", version = "0.11" }
anda_db_hnsw = { path = "../anda_db_hnsw", version = "0.11" }
anda_db_btree = { path = "../anda_db_btree", version = "0.11" }
anda_db_tfs = { path = "../anda_db_tfs", version = "0.11", features = ["full"] }
bytes = { workspace = true }
cbor2 = { workspace = true }
croaring = { workspace = true }
futures = { workspace = true, features = ["std"] }
log = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true, features = [
  "macros",
  "sync",
  "parking_lot",
  "io-util",
  "time",
] }
tokio-util = { workspace = true }
ic_auth_types = { workspace = true, features = ["xid"] }
object_store = { workspace = true, features = ["tokio"] }
moka = { workspace = true }
zstd-safe = { workspace = true }
async-compression = { workspace = true }
rustc-hash = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
tokio = { workspace = true, features = ["full"] }
structured-logger = { workspace = true }
anda_object_store = { path = "../anda_object_store", version = "0.11" }
serde_json = { workspace = true }

[features]
default = []
# Tantivy + Jieba tokenization is NOT optional here: `index::bm25` re-exports
# `default_tokenizer`/`jieba_tokenizer` unconditionally and `Collection` calls
# `default_tokenizer()` on every open, so `anda_db_tfs` is depended on with its
# `full` feature above. `full` therefore only adds the local-filesystem
# object-store backend used by the bundled example.
full = ["object_store/fs"]

[[example]]
name = "db_demo"
required-features = ["full"]

[lib]
doctest = false

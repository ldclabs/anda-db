[package]
name = "anda_cognitive_nexus_server"
version = "0.13.0"
description = "A HTTP server for the Anda Cognitive Nexus, facilitating knowledge interaction via KIP."
categories = ["database", "data-structures", "text-processing"]
repository = "https://github.com/ldclabs/anda-db/tree/main/rs/anda_cognitive_nexus_server"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anda_db_schema = { version = "0.11", path = "../anda_db_schema" }
anda_kip = { version = "0.13", path = "../anda_kip" }
anda_db = { version = "0.11", path = "../anda_db", features = ["full"] }
anda_cognitive_nexus = { version = "0.13", path = "../anda_cognitive_nexus" }
anda_object_store = { version = "0.11", path = "../anda_object_store" }
axum = { workspace = true }
clap = { workspace = true }
dotenv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
structured-logger = { workspace = true }
tokio = { workspace = true, features = ["full"] }
object_store = { workspace = true, features = ["fs", "aws"] }
log = { workspace = true }
mimalloc = { workspace = true }

[dev-dependencies]
http-body-util = { version = "0.1", features = ["channel"] }
tower = { version = "0.5", features = ["util"] }

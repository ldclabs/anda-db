[package]
name = "anda_kip"
version = "0.13.1"
description = "A Rust SDK of KIP 2.0 (Knowledge Interaction Protocol) for building sustainable AI knowledge memory systems."
keywords = ["KIP", "knowledge-graph", "Persistent-Memory", "AGI", "AI-Agent"]
categories = ["database", "data-structures", "text-processing"]
repository = "https://github.com/ldclabs/anda-db/tree/main/rs/anda_kip"
publish = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ryu-js = "0.2.2"
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
nom = { workspace = true }
nom-language = { workspace = true }
thiserror = { workspace = true }

[[bin]]
name = "kip-cli"
path = "src/bin/kip_cli.rs"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
proptest = { workspace = true }
jsonschema = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "protocol"
harness = false

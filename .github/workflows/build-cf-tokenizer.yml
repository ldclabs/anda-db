name: CF Tokenizer
on:
  workflow_dispatch:
    inputs:
      build_tag:
        description: "Docker image tag"
        required: true
        type: string
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ldclabs/cf-tokenizer
jobs:
  build:
    runs-on: ubuntu-latest
    # The push uses the workflow's own GITHUB_TOKEN, which is read-only under
    # the restrictive default policy unless packages: write is declared.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # No rust-cache here: all compilation happens inside `docker build`, so
      # a host-side cargo cache never enters the build context.
      - name: Build the Docker image
        run: |
          cd rs/cf-tokenizer
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login --username ${{ github.actor }} --password-stdin ${{ env.REGISTRY }}
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}_amd64:${{ inputs.build_tag }}"
          LATEST_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}_amd64:latest"
          TAGS="-t ${IMAGE_TAG} -t ${LATEST_TAG}"
          docker build -f ./Dockerfile $TAGS --push .

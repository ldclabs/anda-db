name: Dockers
on:
  workflow_dispatch:
    inputs:
      build_tag:
        description: "Docker image tag"
        required: true
        type: string
  # push:
  #   tags:
  #     - 'v*'
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ldclabs/anda_cognitive_nexus_server
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Build the Docker image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login --username ${{ github.actor }} --password-stdin ${{ env.REGISTRY }}
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}_amd64:${{ inputs.build_tag }}"
          LATEST_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}_amd64:latest"
          TAGS="-t ${IMAGE_TAG} -t ${LATEST_TAG}"
          docker build -f rs/anda_cognitive_nexus_server/Dockerfile $TAGS --push .

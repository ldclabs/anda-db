name: Test
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dfinity/setup-dfx@main
      - name: Run clippy
        run: |
          cargo clippy --verbose --all-targets --all-features
      - name: Install fuzzing tools
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked
      - name: Run full test suite
        run: |
          make test-all
  typescript:
    # `ts/kip-do` is the second KIP 2.0 engine, and the whole point of a second
    # engine is that the two agree. Its conformance suite and its differential
    # parser oracle are what prove that, so they belong in CI rather than in
    # whoever last remembered to run them.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts/kip-do
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        # The lockfile is deliberately not committed (see .gitignore).
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Run tests
        # Includes the shared conformance suite and the WASM parser oracle;
        # the oracle module is committed, so no Rust toolchain is needed here.
        run: pnpm run test
      - name: Check generated files are in sync with their sources
        # The error registry, the bundled profile, the conformance fixtures and
        # the oracle corpus are all generated. A stale one silently narrows what
        # is tested instead of failing, which is how the corpus lost ten
        # commands before anyone noticed.
        run: |
          pnpm run codegen
          git --no-pager diff --exit-code -- . || {
            echo "::error::generated files are stale; run 'pnpm run codegen' in ts/kip-do and commit"
            exit 1
          }
  coverage:
    # Coverage is informational (no threshold gate): it surfaces untested
    # branches in core paths; quality is enforced by the test suites themselves.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dfinity/setup-dfx@main
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Collect coverage
        run: |
          cargo llvm-cov --workspace --all-features --exclude anda_cognitive_nexus_py \
            --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

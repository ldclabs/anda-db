packages:
  - 'ts/kip-do'
allowBuilds:
  esbuild: true
  sharp: false
  workerd: true
# The reference toolkit this repository tracks release-for-release; a version
# published hours ago is one this workspace is *meant* to be on. Name only:
# pnpm matches these against package names, so a `name@version` entry excludes
# nothing and the policy rejects the lockfile it was written to allow.
minimumReleaseAgeExclude:
  - '@ldclabs/kip-lang'
  - '@cloudflare/workers-types@5.20260924.1'
  - wrangler@4.137.0
# @ldclabs/kip-lang 2.4.1 is not on npm yet: resolve it from a sibling KIP
# checkout (github.com/ldclabs/KIP, packages/kip-lang built with `pnpm build`).
# Drop this override once 2.4.1 is published.
overrides:
  '@ldclabs/kip-lang': 'link:../KIP/packages/kip-lang'

[project]
name = "anda-db"
dynamic = ["version"]
description = "AndaDB: A Rust-powered knowledge and memory database for AI agents, with Python FFI."
authors = [
    { name = "LDCLabs", email = "info@ldclabs.com" }
]
license = "MIT"
# pyo3 0.20 — the last line `pyo3-asyncio` supports — refuses interpreters
# newer than 3.12. Without this bound, pip resolves the sdist on 3.13+ and the
# build fails inside a Rust build script instead of at resolution.
requires-python = ">=3.10,<3.13"
keywords = ["database", "ai-agent", "knowledge", "memory", "rust", "ffi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Database"
]

[tool.maturin]
manifest-path = "anda_cognitive_nexus_py/Cargo.toml"
features = ["pyo3/extension-module"]

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project.urls]
Homepage = "https://github.com/ldclabs/anda-db"
Repository = "https://github.com/ldclabs/anda-db"
